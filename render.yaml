# Render blueprint.
#
# Lives at the repo root because Render reads the blueprint from there; `rootDir` is what points it
# at the backend. The mobile app isn't deployed here — it ships through Expo.
services:
  - type: web
    name: swipehire-api
    runtime: node
    plan: free
    region: singapore
    rootDir: swipehire-api
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Every value below is secret or environment-specific. `sync: false` makes Render prompt for
      # it rather than baking a value into a file that lives in a public repo.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: resumes
      # Comma-separated. Empty is correct for a phone-only demo — a native app doesn't enforce CORS,
      # and leaving it open would mean the deployed backend answers arbitrary browser origins.
      - key: CORS_ORIGINS
        sync: false
# No preDeployCommand: Render only runs those on paid instance types, and the database this points
# at is already migrated. Future migrations run with
#   DATABASE_URL="<deployed connection string>" npm run migration:run
# from a laptop, which is also the only way to see the output if one fails.
